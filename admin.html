<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#0d0d0d;
  color:white;
}

.header{
  background:#e50914;
  padding:20px;
  text-align:center;
}

.container{
  width:95%;
  max-width:1100px;
  margin:20px auto;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:#1c1c1c;
  padding:20px;
  border-radius:12px;
  text-align:center;
}

.stat h2{
  margin:5px 0;
  color:#00c853;
}

.table-box{
  background:#1c1c1c;
  padding:15px;
  border-radius:12px;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,
td{
  padding:12px;
  border-bottom:1px solid #333;
  text-align:left;
}

th{
  background:#e50914;
}

tr:hover{
  background:#292929;
}

.empty{
  text-align:center;
  padding:30px;
  color:#aaa;
}

.refresh{
  background:#e50914;
  color:white;
  border:0;
  padding:12px 20px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:15px;
}

</style>

</head>


<body>


<div class="header">

<h1>🎬 CINEMA ADMIN DASHBOARD</h1>

<p>Live Booking Management</p>

</div>


<div class="container">


<!-- STATS -->

<div class="stats">

<div class="stat">

<p>🎟️ Total Bookings</p>

<h2 id="totalBookings">
0
</h2>

</div>


<div class="stat">

<p>💺 Total Tickets</p>

<h2 id="totalTickets">
0
</h2>

</div>


<div class="stat">

<p>💰 Total Revenue</p>

<h2>
₹<span id="totalRevenue">0</span>
</h2>

</div>

</div>


<button
class="refresh"
onclick="location.reload()">

🔄 Refresh

</button>


<!-- BOOKINGS -->

<div class="table-box">

<h2>
📋 All Bookings
</h2>


<table>

<thead>

<tr>

<th>Booking ID</th>

<th>Name</th>

<th>Mobile</th>

<th>Movie</th>

<th>Date</th>

<th>Time</th>

<th>Seats</th>

<th>Payment</th>

<th>Total</th>

</tr>

</thead>


<tbody id="bookingTable">

<tr>

<td
colspan="9"
class="empty">

Loading bookings...

</td>

</tr>

</tbody>

</table>

</div>


</div>


<script type="module">


/* FIREBASE */

import {
  initializeApp
}

from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getDatabase,
  ref,
  onValue
}

from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey:
"AIzaSyAJ6qXw16K4QrwTVv70jrFw22_rFfTWqYQ",

authDomain:
"cinema-booking-5ea96.firebaseapp.com",

projectId:
"cinema-booking-5ea96",

storageBucket:
"cinema-booking-5ea96.firebasestorage.app",

messagingSenderId:
"96605927647",

appId:
"1:96605927647:web:f34088f3aac0a11300916a",

measurementId:
"G-J4C95WV53G"

};


/* INITIALIZE */

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);


/* BOOKINGS */

const bookingsRef =
ref(db,"bookings");


onValue(

bookingsRef,

function(snapshot){

const data =
snapshot.val();

const table =
document.getElementById(
"bookingTable"
);


table.innerHTML = "";


if(!data){

table.innerHTML = `

<tr>

<td
colspan="9"
class="empty">

😔 No bookings yet

</td>

</tr>

`;

document.getElementById(
"totalBookings"
).innerText = "0";

document.getElementById(
"totalTickets"
).innerText = "0";

document.getElementById(
"totalRevenue"
).innerText = "0";

return;

}


/* VARIABLES */

let bookingCount = 0;

let ticketCount = 0;

let revenue = 0;


/* LOOP */

Object.values(data)

.reverse()

.forEach(

function(booking){

bookingCount++;


/* SEATS */

let seats = "";


if(
Array.isArray(
booking.seats
)
){

seats =
booking.seats.join(", ");

ticketCount +=
booking.seats.length;

}


/* REVENUE */

revenue +=
Number(
booking.totalAmount || 0
);


/* ROW */

const row =
document.createElement(
"tr"
);


row.innerHTML = `

<td>
<b>${booking.bookingID || "-"}</b>
</td>

<td>
${booking.name || "-"}
</td>

<td>
${booking.mobile || "-"}
</td>

<td>
${booking.movie || "-"}
</td>

<td>
${booking.date || "-"}
</td>

<td>
${booking.time || "-"}
</td>

<td>
${seats || "-"}
</td>

<td>
${booking.paymentMethod || "-"}
</td>

<td>
₹${booking.totalAmount || 0}
</td>

`;


table.appendChild(
row
);

}

);


/* STATS */

document.getElementById(
"totalBookings"
).innerText =
bookingCount;


document.getElementById(
"totalTickets"
).innerText =
ticketCount;


document.getElementById(
"totalRevenue"
).innerText =
revenue;

}

);


</script>


</body>

</html>
