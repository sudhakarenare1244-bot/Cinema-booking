<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#0d0d0d;
  color:white;
}

.header{
  background:#e50914;
  padding:20px;
  text-align:center;
}

.container{
  width:95%;
  max-width:1100px;
  margin:20px auto;
}

/* LOGIN */

#loginBox{
  max-width:400px;
  margin:60px auto;
  background:#1c1c1c;
  padding:25px;
  border-radius:15px;
}

#loginBox h2{
  text-align:center;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:0;
  border-radius:8px;
  background:#333;
  color:white;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  font-weight:bold;
  cursor:pointer;
}

.loginBtn{
  width:100%;
  background:#e50914;
  color:white;
  margin-top:10px;
}

.logoutBtn{
  background:#333;
  color:white;
  margin-top:10px;
}

/* DASHBOARD */

#dashboard{
  display:none;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:#1c1c1c;
  padding:20px;
  border-radius:12px;
  text-align:center;
}

.stat h2{
  margin:5px 0;
  color:#00c853;
}

.searchBox{
  background:#1c1c1c;
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
}

.searchBox input{
  margin:0;
}

.table-box{
  background:#1c1c1c;
  padding:15px;
  border-radius:12px;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1000px;
}

th,
td{
  padding:12px;
  border-bottom:1px solid #333;
  text-align:left;
}

th{
  background:#e50914;
}

tr:hover{
  background:#292929;
}

.deleteBtn{
  background:#e50914;
  color:white;
  padding:8px 12px;
}

.empty{
  text-align:center;
  padding:30px;
  color:#aaa;
}

.error{
  color:#ff5252;
  text-align:center;
  margin-top:10px;
}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

<h1>🎬 CINEMA ADMIN</h1>

<p>Booking Management System</p>

</div>


<!-- LOGIN -->

<div
id="loginBox"
class="container">

<h2>🔐 Admin Login</h2>

<input
type="email"
id="email"
placeholder="Admin Email"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button
class="loginBtn"
onclick="adminLogin()">

🔐 LOGIN

</button>

<p
id="loginError"
class="error">
</p>

</div>


<!-- DASHBOARD -->

<div
id="dashboard"
class="container">


<button
class="logoutBtn"
onclick="adminLogout()">

🚪 Logout

</button>


<!-- STATS -->

<div class="stats">

<div class="stat">

<p>🎟️ Total Bookings</p>

<h2 id="totalBookings">
0
</h2>

</div>


<div class="stat">

<p>💺 Total Tickets</p>

<h2 id="totalTickets">
0
</h2>

</div>


<div class="stat">

<p>💰 Total Revenue</p>

<h2>
₹<span id="totalRevenue">0</span>
</h2>

</div>

</div>


<!-- SEARCH -->

<div class="searchBox">

<h3>
🔎 Search Booking
</h3>

<input
type="text"
id="search"
placeholder="Search by Booking ID, Name, Mobile or Movie..."
oninput="searchBookings()"
>

</div>


<!-- TABLE -->

<div class="table-box">

<h2>
📋 All Bookings
</h2>


<table>

<thead>

<tr>

<th>Booking ID</th>
<th>Name</th>
<th>Mobile</th>
<th>Movie</th>
<th>Date</th>
<th>Time</th>
<th>Seats</th>
<th>Payment</th>
<th>Total</th>
<th>Action</th>

</tr>

</thead>


<tbody id="bookingTable">

<tr>

<td
colspan="10"
class="empty">

Loading...

</td>

</tr>

</tbody>

</table>

</div>


</div>


<script type="module">


/* ============================
   FIREBASE IMPORT
============================ */

import {
  initializeApp
}

from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getDatabase,
  ref,
  onValue,
  remove
}

from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* AUTH */

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}

from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* ============================
   FIREBASE CONFIG
============================ */

const firebaseConfig = {

apiKey:
"AIzaSyAJ6qXw16K4QrwTVv70jrFw22_rFfTWqYQ",

authDomain:
"cinema-booking-5ea96.firebaseapp.com",

projectId:
"cinema-booking-5ea96",

storageBucket:
"cinema-booking-5ea96.firebasestorage.app",

messagingSenderId:
"96605927647",

appId:
"1:96605927647:web:f34088f3aac0a11300916a",

measurementId:
"G-J4C95WV53G"

};


/* ============================
   INITIALIZE
============================ */

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const auth =
getAuth(app);


/* ============================
   VARIABLES
============================ */

let allBookings = {};


/* ============================
   LOGIN
============================ */

window.adminLogin =
async function(){

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;


const error =
document
.getElementById("loginError");


error.innerText = "";


if(
!email ||
!password
){

error.innerText =
"Please enter email and password.";

return;

}


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}

catch(e){

console.error(e);

error.innerText =
"❌ Invalid email or password.";

}

};


/* ============================
   LOGOUT
============================ */

window.adminLogout =
async function(){

await signOut(auth);

};


/* ============================
   AUTH STATE
============================ */

onAuthStateChanged(

auth,

function(user){

const loginBox =
document.getElementById(
"loginBox"
);

const dashboard =
document.getElementById(
"dashboard"
);


if(user){

loginBox.style.display =
"none";

dashboard.style.display =
"block";

loadBookings();

}

else{

loginBox.style.display =
"block";

dashboard.style.display =
"none";

}

}

);


/* ============================
   LOAD BOOKINGS
============================ */

function loadBookings(){

const bookingsRef =
ref(
db,
"bookings"
);


onValue(

bookingsRef,

function(snapshot){

allBookings =
snapshot.val() || {};


displayBookings(
allBookings
);

}

);

}


/* ============================
   DISPLAY BOOKINGS
============================ */

function displayBookings(
bookings
){

const table =
document.getElementById(
"bookingTable"
);


table.innerHTML = "";


let bookingCount = 0;

let ticketCount = 0;

let revenue = 0;


const entries =
Object.entries(bookings)
.reverse();


if(entries.length === 0){

table.innerHTML = `

<tr>

<td
colspan="10"
class="empty">

😔 No bookings yet.

</td>

</tr>

`;

}


entries.forEach(

function([
key,
booking
]){

bookingCount++;


const seats =
Array.isArray(
booking.seats
)

?

booking.seats.join(", ")

:

"-";


ticketCount +=
Array.isArray(
booking.seats
)

?

booking.seats.length

:

0;


revenue +=
Number(
booking.totalAmount || 0
);


const row =
document.createElement(
"tr"
);


row.innerHTML = `

<td>
<b>
${booking.bookingID || "-"}
</b>
</td>

<td>
${booking.name || "-"}
</td>

<td>
${booking.mobile || "-"}
</td>

<td>
${booking.movie || "-"}
</td>

<td>
${booking.date || "-"}
</td>

<td>
${booking.time || "-"}
</td>

<td>
${seats}
</td>

<td>
${booking.paymentMethod || "-"}
</td>

<td>
₹${booking.totalAmount || 0}
</td>

<td>

<button
class="deleteBtn"
onclick="deleteBooking('${key}')">

🗑️ Delete

</button>

</td>

`;


table.appendChild(
row
);

}

);


/* STATS */

document.getElementById(
"totalBookings"
).innerText =
bookingCount;


document.getElementById(
"totalTickets"
).innerText =
ticketCount;


document.getElementById(
"totalRevenue"
).innerText =
revenue;

}


/* ============================
   SEARCH
============================ */

window.searchBookings =
function(){

const search =
document
.getElementById("search")
.value
.toLowerCase()
.trim();


if(!search){

displayBookings(
allBookings
);

return;

}


const filtered = {};


Object.entries(
allBookings
)
.forEach(

function([
key,
booking
]){

const text = (

(booking.bookingID || "") +

" " +

(booking.name || "") +

" " +

(booking.mobile || "") +

" " +

(booking.movie || "") +

" " +

(booking.date || "") +

" " +

(booking.time || "")

).toLowerCase();


if(
text.includes(search)
){

filtered[key] =
booking;

}

}
);


displayBookings(
filtered
);

};


/* ============================
   DELETE BOOKING
============================ */

window.deleteBooking =
async function(key){

const booking =
allBookings[key];


if(!booking){

return;

}


const confirmDelete =
confirm(

"Delete booking " +

(booking.bookingID || "") +

"?\n\nThis action cannot be undone."

);


if(!confirmDelete){

return;

}


try{

/* DELETE MAIN BOOKING */

await remove(
ref(
db,
"bookings/" +
key
)
);


/* DELETE BOOKED SEATS */

if(
booking.showKey &&
Array.isArray(
booking.seats
)
){

for(
const seat
of booking.seats
){

await remove(

ref(
db,
"showBookings/" +
booking.showKey +
"/" +
seat
)

);

}

}


alert(
"✅ Booking deleted successfully."
);

}

catch(error){

console.error(error);

alert(
"❌ Delete failed:\n" +
error.message
);

}

};


</script>


</body>

  </html>
